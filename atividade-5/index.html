<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira de Maçãs - Dungeon Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: url('assets/fruta.png') no-repeat center center fixed; background-size: cover;">
    <div id="particle-container"></div>

    <div id="panel" class="panel">
        
        <div id="logoSpace" class="logo-space">
            <span style="font-size: 3em;">🍎🍏</span>
        </div>

        <div class="compra-section">
            <h3>Barraca de Maçãs</h3>
            <p class="regras">Menos de 12: <b>R$ 1,30</b> cada<br>12 ou mais: <b>R$ 1,00</b> cada</p>
            
            <label for="quantidade">Quantas maçãs você quer?</label>
            <input type="number" id="quantidade" placeholder="Ex: 15" min="0" step="1">
        </div>

        <div class="button-container">
            <button id="calcularBtn">💰 Calcular Total 💰</button>
        </div>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
