<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora do Bahia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="assets/ECBahia.png" alt="Logo Bahia" class="logo-bahia">
        
        <h1>Calculadora</h1>

        <label for="n1">Digite 1º número:</label>
        <input type="number" id="n1" placeholder="Ex: 10">

        <label for="n2">Digite 2º número:</label>
        <input type="number" id="n2" placeholder="Ex: 5">

        <button id="gerarBtn">Calcular Resultado</button>

        <div id="resultadoTabuada"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
